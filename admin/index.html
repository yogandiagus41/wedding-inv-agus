<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5c3a46">
    <title>Kirim Undangan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">
    <div class="top-in">
        <span class="logo">&hearts;</span>
        <div>
            <h1>Kirim Undangan</h1>
            <p>Agus &amp; Wenna &middot; 5 Desember 2026</p>
        </div>
    </div>
</header>

<main class="layout">

    <!-- FORM -->
    <section class="panel form-panel">
        <h2>Undangan baru</h2>

        <form id="inviteForm" autocomplete="off" novalidate>

            <div class="field">
                <label for="guestName">Nama tamu</label>
                <input type="text" id="guestName" placeholder="Contoh: Agus Yogandi" required>
            </div>

            <div class="field">
                <label for="guestGroup">Kelompok</label>
                <input type="text" id="guestGroup" list="groupOptions" placeholder="Contoh: Teman Sekolah" required>
                <datalist id="groupOptions"></datalist>
                <div class="quick" id="quickGroups"></div>
            </div>

            <div class="field">
                <label for="guestPhone">Nomor WhatsApp <em>(opsional)</em></label>
                <input type="tel" id="guestPhone" inputmode="tel" placeholder="Contoh: 081234567890">
                <small>Diisi: pesan langsung terbuka di chat tamu. Kosong: pilih kontak sendiri di WhatsApp.</small>
            </div>

            <label class="check">
                <input type="checkbox" id="withPartner" checked>
                <span>Tambahkan &ldquo;&amp; Partner&rdquo; di nama tamu</span>
            </label>

            <details class="preview">
                <summary>Lihat isi pesan</summary>
                <div class="bubble" id="preview"></div>
            </details>

            <button type="submit" class="btn-send" id="sendWA">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
                Kirim via WhatsApp
            </button>
        </form>
    </section>

    <!-- DAFTAR -->
    <section class="panel list-panel">

        <div class="stats">
            <div class="stat"><b id="statTotal">0</b><span>Undangan</span></div>
            <div class="stat"><b id="statGroup">0</b><span>Kelompok</span></div>
            <div class="stat"><b id="statToday">0</b><span>Hari ini</span></div>
        </div>

        <div class="toolbar">
            <div class="search">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="search" placeholder="Cari nama tamu...">
            </div>
            <button type="button" class="btn-ghost danger" id="resetData">Reset semua</button>
        </div>

        <div class="chips" id="chips"></div>

        <div id="guestList" class="guest-list"></div>
    </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
